{{- if eq .Values.type "StatefulSet" -}}
apiVersion: v1
kind: Service
metadata:
  name: headless-{{ include "app.fullname" . }}
  {{- with .Values.service.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
  labels:
{{ include "app.labels" . | indent 4 }}
spec:
  clusterIP: None
{{- if .Values.ports }}
  ports:
{{- end }}
{{- if .Values.ports }}
{{ toYaml .Values.ports | indent 4}}
{{- end }}
  selector:
    app.kubernetes.io/name: {{ include "app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}