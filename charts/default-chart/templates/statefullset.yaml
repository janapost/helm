{{- if eq .Values.type "StatefulSet" -}}
{{- $releaseName := .Release.Name -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "app.fullname" . }}
  labels:
{{ include "app.labels" . | indent 4 }}
spec:
  serviceName: headless-{{ include "app.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
      app.kubernetes.io/instance: {{ $releaseName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}
        app.kubernetes.io/instance: {{ $releaseName }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
        fsGroup: {{ .Values.fsGroup }}
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        fsGroupChangePolicy: Always
      serviceAccountName: {{ .Values.nameOverride }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.name }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          {{- range $name, $value := .Values.env }}
          {{- if not (empty $value) }}
          - name: {{ $name | quote }}
            value: {{ $value | quote }}
          {{- end }}
          {{- end }}
          {{- if .Values.secretEnv }}
          {{- range .Values.secretEnv }}
          - name: {{ .secretEnvName}}
            valueFrom:
              secretKeyRef:
                name: {{ .secretName }}
                key: {{ .secretKeys }}
          {{- end }}
          {{- end }}
          {{- if .Values.secrets }}
          {{- range $key := .Values.secrets }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ $.Values.nameOverride }}-secret
                key: {{ $key }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{ if (or .Values.livenessProbe .Values.readinessProbe) }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- else -}} 
          livenessProbe:
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            tcpSocket:
              port: {{ .Values.service.targetPort }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.secrets (and .Values.volumeMounts .Values.volumes) }}
          volumeMounts:
          {{- if and .Values.volumeMounts .Values.volumes }}
{{ toYaml .Values.volumeMounts | indent 12 }}
          {{- end }}
          {{- if .Values.secrets }}
          - mountPath: /mnt/secrets
            name: secrets-store
            readOnly: true
          {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- if or .Values.secrets (and .Values.volumeMounts .Values.volumes) }}
      volumes:
      {{- if and .Values.volumeMounts .Values.volumes }}
{{ toYaml .Values.volumes | indent 8 }}
      {{- end }}
      {{- if .Values.secrets }}
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ include "app.fullname" . }}-secret
        name: secrets-store
      {{- end }}
      {{- end }}
  {{- if and .Values.volumeMounts .Values.volumeClaimTemplates }}
  volumeClaimTemplates:
{{ toYaml .Values.volumeClaimTemplates | indent 4 }}             
  {{- end }}
{{- end }}
